name: Validate Public Helpers

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verify public Tinman distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Tinman
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify profile-neutral public distribution
        run: python3 checks/verify_tinman_distribution.py

      - name: Verify build identity and incremental rebuild isolation
        run: python3 checks/test_tinman_build_info.py
